name: smartq_mobile
description: "SmartQ - AI-Powered Virtual Queue & Behavior Prediction Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  lucide_icons: ^0.257.0
  flutter_spinkit: ^5.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Real-Time
  dio: ^5.4.3+1
  socket_io_client: ^3.0.0
  connectivity_plus: ^6.0.3

  # Location & Maps
  geolocator: ^12.0.0

  # Local Notifications & QR
  flutter_local_notifications: ^17.1.2
  qr_flutter: ^4.1.0

  # Storage & Utilities
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
